<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kontakt</title>

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
    <!-- <link rel="stylesheet" href="css/service-form.css"> -->

</head>

<body>

    <header id="header"></header>

    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card border-0 shadow-lg contact-card">

                    <div class="card-body p-5">

                        <h1 class="fw-bold text-center mb-4">
                            Kontaktformular
                        </h1>

                        <p class="text-muted text-center mb-5">

                            Schreiben Sie uns und wir melden uns
                            schnellstmöglich bei Ihnen.

                        </p>

                        <form class="custom-form" data-form-type="contact">

                            <input type="text" name="name" class="form-control mb-3" placeholder="Vorname" required>
                            <input type="text" name="lastname" class="form-control mb-3" placeholder="Nachname"
                                required>
                            <input type="email" name="email" class="form-control mb-3" placeholder="Email" required>

                            <textarea name="message" class="form-control mb-3" rows="5"
                                placeholder="Nachricht"></textarea>

                            <div class="form-feedback"></div>

                            <button class="btn btn-primary w-100">

                                Nachricht senden

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <footer id="footer"></footer>
    <div id="cookie-banner"></div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script type="module" src="js/index.js"></script>

</body>

</html>
